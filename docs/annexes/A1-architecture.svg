<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5e5e5"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#1c1c1e"/>

  <!-- Titre -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#f2f2f2">Snap2CAD — Architecture globale</text>
  <text x="40" y="88" font-size="15" fill="#a1a1a6">Electron (interface) · worker Python local · une étape = un sous-processus · dossier projet = source de vérité</text>

  <!-- Légende -->
  <g font-size="13" fill="#d1d1d6">
    <rect x="930" y="40" width="14" height="14" rx="3" fill="#f2b880"/><text x="950" y="52">GPU</text>
    <rect x="1000" y="40" width="14" height="14" rx="3" fill="#c9d3e3"/><text x="1020" y="52">CPU</text>
    <rect x="1070" y="40" width="14" height="14" rx="3" fill="#a9c7f5"/><text x="1090" y="52">Worker</text>
    <rect x="1155" y="40" width="14" height="14" rx="3" fill="#d9d9d9"/><text x="1175" y="52">Données</text>
    <rect x="1250" y="40" width="14" height="14" rx="3" fill="none" stroke="#8e8e93" stroke-dasharray="4 3"/><text x="1270" y="52">Repli / option</text>
  </g>

  <!-- Conteneurs -->
  <g fill="#232326" stroke="#3a3a3c" stroke-width="1.5">
    <rect x="40" y="120" width="380" height="580" rx="14"/>
    <rect x="500" y="120" width="380" height="580" rx="14"/>
    <rect x="960" y="120" width="400" height="580" rx="14"/>
  </g>
  <g font-size="15" font-weight="700" fill="#c7c7cc">
    <text x="60" y="148">Application Electron</text>
    <text x="520" y="148">Worker Python · snap2cad</text>
    <text x="980" y="148">Étapes · un sous-processus chacune</text>
  </g>

  <!-- Electron -->
  <rect x="60" y="165" width="340" height="170" rx="10" fill="#d9d9d9"/>
  <text x="76" y="192" font-size="17" font-weight="700" fill="#1c1c1e">Processus principal (Node)</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="76" y="220">• Cycle de vie de l'application</text>
    <text x="76" y="244">• Lance et surveille le worker</text>
    <text x="76" y="268">• 1er lancement : env. Python (uv)</text>
    <text x="76" y="292">• Poids : téléchargement reprenable</text>
    <text x="76" y="316">• Vérification SHA-256</text>
  </g>

  <rect x="60" y="355" width="340" height="325" rx="10" fill="#d9d9d9"/>
  <text x="76" y="382" font-size="17" font-weight="700" fill="#1c1c1e">Interface · React + three.js</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="76" y="410">• Projets et import des photos</text>
    <text x="76" y="436">• Détourage par clics (SAM 2.1)</text>
    <text x="76" y="462">• Vue 3D : texture, mesuré / généré,</text>
    <text x="90" y="488">incertitude, couverture</text>
    <text x="76" y="514">• Mesures : distance, Ø, épaisseur</text>
    <text x="76" y="540">• Cotes au pied à coulisse</text>
    <text x="76" y="566">• Assistant de prise de vue</text>
    <text x="76" y="592">• Exports et rapport</text>
    <text x="76" y="618">• Sélection 3D : three-mesh-bvh</text>
  </g>

  <!-- Worker -->
  <rect x="520" y="165" width="340" height="135" rx="10" fill="#a9c7f5"/>
  <text x="536" y="192" font-size="17" font-weight="700" fill="#1c1c1e">API locale · FastAPI</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="536" y="220">• HTTP : commandes</text>
    <text x="536" y="244">• WebSocket : progression, journaux</text>
    <text x="536" y="268">• 127.0.0.1 + jeton + contrôle Host</text>
  </g>

  <rect x="520" y="320" width="340" height="175" rx="10" fill="#a9c7f5"/>
  <text x="536" y="347" font-size="17" font-weight="700" fill="#1c1c1e">Orchestrateur</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="536" y="375">• Graphe d'étapes</text>
    <text x="536" y="399">• Cache par hash (project.json)</text>
    <text x="536" y="423">• File, annulation, reprise</text>
    <text x="536" y="447">• Une seule étape GPU à la fois</text>
    <text x="536" y="471">• Pic de VRAM enregistré</text>
  </g>

  <rect x="520" y="515" width="340" height="165" rx="10" fill="#a9c7f5"/>
  <text x="536" y="542" font-size="17" font-weight="700" fill="#1c1c1e">device.py</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="536" y="570">• cuda · mps · cpu</text>
    <text x="536" y="594">• bf16 · fp16 · fp32</text>
    <text x="536" y="618">• Profil full (≥ 8 Go)</text>
    <text x="536" y="642">• Profil degraded (6 Go)</text>
  </g>

  <!-- Étapes -->
  <g font-size="14">
    <rect x="980" y="160" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="182" fill="#1c1c1e"><tspan font-weight="700">import</tspan> — EXIF, HEIC, contrôles</text><text x="1325" y="182" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="200" width="360" height="34" rx="8" fill="#f2b880"/>
    <text x="995" y="222" fill="#1c1c1e"><tspan font-weight="700">poses_init</tspan> — VGGT bf16</text><text x="1325" y="222" text-anchor="end" fill="#3a3a3c" font-size="12">GPU</text>

    <rect x="980" y="240" width="360" height="34" rx="8" fill="#f2b880"/>
    <text x="995" y="262" fill="#1c1c1e"><tspan font-weight="700">segment</tspan> — SAM 2.1 / BiRefNet</text><text x="1325" y="262" text-anchor="end" fill="#3a3a3c" font-size="12">GPU</text>

    <rect x="980" y="280" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="302" fill="#1c1c1e"><tspan font-weight="700">ba</tspan> — pycolmap, pleine résolution</text><text x="1325" y="302" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="320" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="342" fill="#1c1c1e"><tspan font-weight="700">scale</tspan> — pièce / carte, repère</text><text x="1325" y="342" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="360" width="360" height="34" rx="8" fill="#f2b880"/>
    <text x="995" y="382" fill="#1c1c1e"><tspan font-weight="700">dense</tspan> — COLMAP CUDA / OpenMVS</text><text x="1325" y="382" text-anchor="end" fill="#3a3a3c" font-size="12">GPU·CPU</text>

    <rect x="980" y="400" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="422" fill="#1c1c1e"><tspan font-weight="700">coverage</tspan> — ≥ 3 vues, ≥ 15°</text><text x="1325" y="422" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="440" width="360" height="34" rx="8" fill="none" stroke="#8e8e93" stroke-dasharray="5 4"/>
    <text x="995" y="462" fill="#e5e5e5"><tspan font-weight="700">complete</tspan> — Hunyuan3D-2mv (repli)</text><text x="1325" y="462" text-anchor="end" fill="#f2b880" font-size="12">GPU</text>

    <rect x="980" y="480" width="360" height="34" rx="8" fill="none" stroke="#8e8e93" stroke-dasharray="5 4"/>
    <text x="995" y="502" fill="#e5e5e5"><tspan font-weight="700">merge_sessions</tspan> — FPFH + ICP</text><text x="1325" y="502" text-anchor="end" fill="#c9d3e3" font-size="12">CPU</text>

    <rect x="980" y="520" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="542" fill="#1c1c1e"><tspan font-weight="700">mesh</tspan> — Poisson, nettoyage</text><text x="1325" y="542" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="560" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="582" fill="#1c1c1e"><tspan font-weight="700">uncertainty</tspan> — σ en mm par sommet</text><text x="1325" y="582" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="600" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="622" fill="#1c1c1e"><tspan font-weight="700">measure</tspan> — cotes, recalage</text><text x="1325" y="622" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>

    <rect x="980" y="640" width="360" height="34" rx="8" fill="#c9d3e3"/>
    <text x="995" y="662" fill="#1c1c1e"><tspan font-weight="700">export</tspan> — STL, OBJ, PLY, GLB, STEP</text><text x="1325" y="662" text-anchor="end" fill="#3a3a3c" font-size="12">CPU</text>
  </g>

  <!-- Données -->
  <rect x="500" y="740" width="380" height="120" rx="10" fill="#d9d9d9"/>
  <text x="516" y="767" font-size="17" font-weight="700" fill="#1c1c1e">Dossier projet (source de vérité)</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="516" y="793">project.json · images/ · masks/ · vggt/</text>
    <text x="516" y="815">sparse/ · dense/ · mesh.ply · preview.glb</text>
    <text x="516" y="837">rapports JSON · exports/</text>
  </g>

  <rect x="960" y="740" width="400" height="120" rx="10" fill="#d9d9d9"/>
  <text x="976" y="767" font-size="17" font-weight="700" fill="#1c1c1e">Magasin de modèles</text>
  <g font-size="14" fill="#1c1c1e">
    <text x="976" y="793">VGGT-1B bf16 · SAM 2.1 · BiRefNet</text>
    <text x="976" y="815">Hunyuan3D-2mv · CAD-Recode (phase 2)</text>
    <text x="976" y="837">manifest.json : URL, taille, SHA-256</text>
  </g>

  <!-- Flèches -->
  <g stroke="#e5e5e5" stroke-width="2" fill="none">
    <line x1="400" y1="232" x2="516" y2="232" marker-end="url(#arr)"/>
    <polyline points="400,420 460,420 460,285 516,285" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="860" y1="400" x2="976" y2="400" marker-end="url(#arr)"/>
    <polyline points="1050,700 1050,720 700,720 700,736" marker-end="url(#arr)"/>
    <line x1="1180" y1="700" x2="1180" y2="736" marker-end="url(#arr)"/>
    <polyline points="498,800 230,800 230,684" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" fill="#d1d1d6">
    <text x="458" y="224" text-anchor="middle">lance</text>
    <text x="458" y="250" text-anchor="middle" fill="#a1a1a6">port + jeton</text>
    <text x="452" y="352" text-anchor="middle" transform="rotate(-90 452 352)">HTTP · WebSocket</text>
    <text x="918" y="392" text-anchor="middle">lance</text>
    <text x="918" y="418" text-anchor="middle" fill="#a1a1a6">sous-processus</text>
    <text x="875" y="714" text-anchor="middle">lit / écrit</text>
    <text x="1190" y="724">charge les poids</text>
    <text x="364" y="792" text-anchor="middle">GLB / PLY / JSON servis par l'API</text>
  </g>
</svg>
