[project]
name = "snap2cad"
version = "0.1.0"
description = "Worker Python de Snap2CAD : photos -> modèle 3D à l'échelle"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.7.*",
    "torchvision==0.22.*",
    "numpy==1.26.4",
    "safetensors",
    "pillow",
    "vggt",
    "pillow-heif>=1.8.1",
    "trimesh>=5.2.0",
    "sam-2",
    "pycolmap==3.11.*",
    "lightglue",
    "opencv-python>=4.10",
    "timm>=1.0.31",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
vggt = { path = "../third_party/vggt", editable = true }
sam-2 = { path = "../third_party/sam2", editable = true }
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
lightglue = { git = "https://github.com/jytime/LightGlue", rev = "2f23ca2ea9638cecad7f7220795210fc6b8353c3" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]  # tools/eval (adaptateurs DTU / MobileBrick, métriques)
markers = ["gpu: nécessite un GPU (lancer avec -m gpu)"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["snap2cad", "tools"]

[tool.uv.extra-build-variables]
sam-2 = { SAM2_BUILD_CUDA = "0" }  # extension CUDA optionnelle (post-traitement des trous) ignorée, plan §6.1
